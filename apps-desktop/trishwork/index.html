<!DOCTYPE html>
<html lang="vi" data-app="work">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrishWork — Kỹ sư · Thư viện · ISO</title>
    <style>
      /* Splash hiện NGAY (HTML tĩnh) trước khi JS/React chạy — tránh màn trắng bệt */
      html, body { margin: 0; height: 100%; background: #0e1116; }
      #app-splash {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; background: #0e1116;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        transition: opacity 0.35s ease;
      }
      #app-splash .sp-logo { font-size: 22px; font-weight: 700; color: #e6edf3; letter-spacing: 0.5px; }
      #app-splash .sp-logo b { color: #34d399; }
      #app-splash .sp-ring {
        width: 44px; height: 44px; border-radius: 50%;
        border: 3px solid rgba(52,211,153,0.25); border-top-color: #34d399;
        animation: sp-spin 0.8s linear infinite;
      }
      #app-splash .sp-text { font-size: 13px; color: #8b949e; }
      @keyframes sp-spin { to { transform: rotate(360deg); } }
      #app-splash.sp-hide { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="app-splash">
      <div class="sp-ring"></div>
      <div class="sp-logo">Trish<b>Work</b></div>
      <div class="sp-text">Đang khởi động…</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
